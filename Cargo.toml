[package]
name = "embedded_ide_0"
version = "0.1.0"
edition = "2024"
authors = ["Traian Istrati"]

[dependencies]
eframe           = { version = "0.34.1", features = ["persistence"] }
egui             = "0.34.1"
egui_code_editor = "0.3.2"
egui-phosphor    = { version = "0.12.0", features = ["regular"] }
rfd              = "0.15"
serde_json       = "1"
serde            = { version = "1", features = ["derive"] }
similar          = "2"
ron              = "0.8"
notify           = "6"
serialport = "4"
rusb = "0.9"
ureq = "2"
roxmltree = "0.20"

# Killing a PROCESS GROUP (the rust-analyzer tree) has no std equivalent — the
# Windows side shells out to `taskkill /T`, the unixes need `kill(-pgid)`.
# Already in the tree transitively (rusb / serialport / eframe), so this costs
# nothing to build; unix-only so the Windows build is untouched.
[target.'cfg(unix)'.dependencies]
libc = "0.2"


[dev-dependencies]
tempfile = "3.8"
