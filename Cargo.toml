[package]
name = "rust_on_chip"
version = "0.2.8"
edition = "2024"
authors = ["Traian Istrati"]
license = "MIT OR Apache-2.0"

[dependencies]
eframe           = { version = "0.34.1", features = ["persistence"] }
egui             = "0.34.1"
# Capped below 0.3.7: 0.3.7 and later require egui 0.35/0.36, so a plain
# `cargo update` would pull a second egui into the lock and fail to build.
# Lift the cap together with the egui 0.36 upgrade (then `=0.3.8`).
egui_code_editor = ">=0.3.2, <0.3.7"
egui-phosphor    = { version = "0.12.0", features = ["regular"] }
rfd              = "0.17"
serde_json       = "1"
serde            = { version = "1", features = ["derive"] }
similar          = "3"
ron              = "0.12"
notify           = "8"
serialport = "4"
rusb = "0.9"
ureq = "2"
roxmltree = "0.21.1"
# Format-PRESERVING TOML: the publish dialog writes fields into the user's own
# Cargo.toml, so comments, ordering and line endings have to survive. Already in
# the lockfile transitively, so this costs no extra build.
toml_edit  = "0.25"

# Decoding the images attached to Virtual Module notes. Already in the tree -
# eframe pulls `image` 0.25 through arboard, with png and bmp - so this adds no
# crate to Cargo.lock. It only turns on `jpeg`, whose zune-jpeg is already
# locked (reached through tiff on other targets) and is two small pure-Rust
# crates to compile here. `default-features = false` is NOT optional: the
# defaults switch on rayon and every format, which WOULD add crates.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }

# Parsing a Virtual Module note's link the way the browser launcher will, so a
# link that does not parse is refused here rather than opened as a local file
# (see `notes::openable_link`). Already in Cargo.lock through ureq and
# webbrowser, so this adds no crate.
url = "2"

# Parsing the user's own Rust into a control-flow chart (the Flow tab). `syn`
# was ALREADY in the tree (serde_derive pulls 2.0.117), so this adds no crate —
# it only turns on `full`, which is what makes expressions (if / match / loop /
# await) parseable instead of just item signatures.
#
# `span-locations` is NOT optional here despite looking like a nicety:
# `Span::start()` does not exist without it (the method is cfg'd out, not
# stubbed), and every flowchart box carries the source line it came from so a
# click can jump there. Verified by compiling both ways before committing to it.
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

# Killing a PROCESS GROUP (the rust-analyzer tree) has no std equivalent — the
# Windows side shells out to `taskkill /T`, the unixes need `kill(-pgid)`.
# Already in the tree transitively (rusb / serialport / eframe), so this costs
# nothing to build; unix-only so the Windows build is untouched.
[target.'cfg(unix)'.dependencies]
libc = "0.2"


[dev-dependencies]
tempfile = "3.8"

[profile.dev.package."*"]
opt-level = 2
debug = "line-tables-only"
